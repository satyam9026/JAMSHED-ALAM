<body>

<div class="container">

    <h1 class="main-title">JAMSHED ALAM</h1>

    <!-- Subscriber Auto Counter -->
    <h2 class="subscribers" id="subCounter">106,897</h2>

<!-- 🔥 Auto Subscriber Counter Script -->
<script>
    let target = 106897;         // Final subscriber count
    let duration = 2000;         // Animation duration in ms
    let frameRate = 30;          // Updates per second

    let steps = duration / (1000 / frameRate);
    let increment = target / steps;

    let counter = document.getElementById("subCounter");
    let current = 0;

    let updateCounter = setInterval(() => {
        current += increment;

        if (current >= target) {
            current = target;
            clearInterval(updateCounter);
        }

        counter.innerText = Math.floor(current).toLocaleString();
    }, 1000 / frameRate);
</script>

</body>
